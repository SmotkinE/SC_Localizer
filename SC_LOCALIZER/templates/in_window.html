<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SC Localizer</title>
<link rel="icon" href="/favicon.ico">
<!-- Показывается во вкладке браузера, когда программа уже работает в своём
     окне: например, старая вкладка дождалась перезапуска после обновления. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0e1621; color: #7e93aa;
         font: 14px/1.55 "Segoe UI", system-ui, sans-serif;
         text-align: center; padding: 60px 20px; }
  b { color: #dbe6f3; font-weight: 600; }
</style>
</head>
<body>
  <b>SC Localizer открыт в своём окне.</b><br>
  Эту вкладку можно закрыть.
</body>
</html>
