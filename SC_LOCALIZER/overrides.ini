; РУЧНЫЕ ИСПРАВЛЕНИЯ ПЕРЕВОДА
;
; Строки отсюда ложатся ПОВЕРХ русского файла и не зависят от галочек категорий.
; Исходный перевод не трогается — его можно спокойно обновлять.
;
; Формат:   Ключ=Текст
; Комментарий — строка, начинающаяся с ; или #
;
; Как найти ключ: возьми английскую фразу из игры и поищи её в английском
; global.ini обычным поиском (Ctrl+F). Слева от = и будет ключ.
;
; ВАЖНО: подстановки вида ~mission(Ship) и %ls обязаны остаться на месте,
; иначе игра покажет мусор. Программа такие строки проверяет и при поломке
; пропускает, оставляя английский.

; --- Исправления смысла ---

; "Get clear of the ship" значит "отлети от корабля", то есть увеличь дистанцию.
; В переводе было "Покиньте корабль" — это читается как "выйди наружу",
; почти противоположное действие.
BoardShip_obj_long_04=Отлетите от корабля ~mission(Ship), чтобы он смог совершить прыжок.
